name: ZEROHUB APK BUILDER

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: GearPlug/build-apk-action@v1.0.0
        with:
          post-url: ''

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEROHUB-APP-BUILD
          path: '**/*.apk'
