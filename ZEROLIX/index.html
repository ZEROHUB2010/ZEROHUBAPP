<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZEROHUB Studio Mobile</title>
  
  <!-- Иконкаи рақамии барнома -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">
  <meta name="theme-color" content="#00f0ff">

  <!-- Tailwind CSS & Material Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      background: #020205;
      color: #e6eef8;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    
    /* Тугмаи хурди шинокунанда (Floating Action Button) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #00f0ff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      z-index: 9999;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .fab-btn:active { transform: scale(0.9); }

    /* Менюи пайдошаванда бо 0px blur ва шаффоф */
    .fab-menu {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: rgba(15, 17, 21, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 9998;
      width: 220px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    }
    .fab-menu.active { display: flex; }

    /* Майдони корӣ (Canvas) */
    #canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="p-3 flex flex-col items-center justify-between min-h-screen">

  <!-- Сарлавҳа ва Тугмаи Насби Барнома -->
  <header class="w-full text-center my-2 flex flex-col items-center">
    <h1 class="text-xl font-bold text-cyan-400 tracking-wider">ZEROHUB STUDIO</h1>
    <p class="text-[10px] text-slate-400">Барномаи тоза барои дизайн ва кор бо аксҳо</p>

    <!-- Ин тугма ҳангоми дар браузери телефон кушодан пайдо мешавад -->
    <button id="installBtn" class="mt-3 px-4 py-2 bg-cyan-400 text-black font-bold text-xs rounded-full shadow-lg shadow-cyan-500/20 flex items-center gap-1">
      <span class="material-icons text-sm">download</span> Насб кардани барнома ба телефон
    </button>
  </header>

  <!-- Экрани Асосӣ / Майдони Корӣ (Canvas) -->
  <main id="canvas" class="w-full max-w-sm h-[480px] bg-slate-950 border border-slate-800 rounded-2xl relative overflow-hidden flex items-center justify-center">
    <p id="placeholderText" class="text-xs text-slate-600 text-center p-4">
      Майдони корӣ холӣ аст.<br>Барои илова кардани акс ё элемент тугмаи фирӯзиро пахш кунед.
    </p>
  </main>

  <footer class="text-[10px] text-slate-600 my-2">
    ZEROHUB © 2026 — Барномаи шахсӣ
  </footer>

  <!-- Инпути пинҳонӣ барои бор кардани акс аз галерея -->
  <input type="file" id="imageInput" accept="image/*" class="hidden">

  <!-- Тугмаи Хурдакаки Шинокунанда (FAB) -->
  <div id="fabBtn" class="fab-btn">
    <span class="material-icons">add</span>
  </div>

  <!-- Менюи Инструментҳо -->
  <div id="fabMenu" class="fab-menu">
    <button id="uploadImgBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 flex items-center gap-2">
      <span class="material-icons text-sm">photo_library</span> Бор кардан аз Галерея
    </button>
    <button id="addTextBtn" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-emerald-400 flex items-center gap-2">
      <span class="material-icons text-sm">text_fields</span> Иловаи Матн
    </button>
    <button id="clearBtn" class="p-2 bg-red-950/60 hover:bg-red-900/80 text-red-300 rounded-lg text-xs flex items-center gap-2 border border-red-800/40">
      <span class="material-icons text-sm">delete</span> Тоза кардани экран
    </button>
  </div>

  <script>
    const fabBtn = document.getElementById('fabBtn');
    const fabMenu = document.getElementById('fabMenu');
    const canvas = document.getElementById('canvas');
    const placeholderText = document.getElementById('placeholderText');
    const imageInput = document.getElementById('imageInput');
    const uploadImgBtn = document.getElementById('uploadImgBtn');

    // Кушода ва маҳкам кардани меню
    fabBtn.addEventListener('click', () => {
      fabMenu.classList.toggle('active');
    });

    // Занги изтирорӣ барои интихоби акс аз Галерея
    uploadImgBtn.addEventListener('click', () => {
      imageInput.click();
      fabMenu.classList.remove('active');
    });

    // Вақте корбар аз галерея аксро интихоб мекунад:
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          if (placeholderText) placeholderText.style.display = 'none';
          
          const img = document.createElement('img');
          img.src = event.target.result;
          img.className = 'max-w-full max-h-full object-contain absolute rounded-lg shadow-2xl';
          canvas.appendChild(img);
        };
        reader.readAsDataURL(file);
      }
    });

    // Илова кардани матн
    document.getElementById('addTextBtn').addEventListener('click', () => {
      if (placeholderText) placeholderText.style.display = 'none';
      const text = document.createElement('div');
      text.innerText = "ZEROHUB";
      text.className = "absolute text-cyan-400 font-bold text-lg cursor-pointer select-none";
      text.style.top = "45%";
      canvas.appendChild(text);
      fabMenu.classList.remove('active');
    });

    // Тоза кардани экран
    document.getElementById('clearBtn').addEventListener('click', () => {
      canvas.innerHTML = '<p id="placeholderText" class="text-xs text-slate-600 text-center p-4">Майдони корӣ холӣ аст.</p>';
      fabMenu.classList.remove('active');
    });

    // Танзими насби барнома ба телефон
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'flex';
    });

    document.getElementById('installBtn').addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
