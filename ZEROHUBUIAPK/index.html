<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROHUB HTML to APK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #020205;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5em; color: #00f0ff; margin-bottom: 10px; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
        }
        .panel h2 { color: #00f0ff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00f0ff; font-weight: 600; }
        input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            margin-bottom: 15px;
        }
        textarea { min-height: 300px; font-family: 'Courier New'; }
        .btn-primary {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .editor-container { grid-column: 1 / -1; }
        .code-editor-wrapper { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 12px; }
        .editor-header { background: rgba(0, 240, 255, 0.1); padding: 15px 20px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .status-message { padding: 15px; margin-bottom: 20px; border-radius: 8px; display: none; }
        .status-message.show { display: block; }
        .status-message.success { background: rgba(0, 240, 100, 0.2); color: #00f064; }
        .status-message.error { background: rgba(240, 0, 100, 0.2); color: #f00064; }
        .status-message.loading { background: rgba(0, 240, 255, 0.2); color: #00f0ff; }
        .icon-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            min-height: 120px;
            background: rgba(0, 240, 255, 0.02);
        }
        .icon-preview img {
            max-width: 80px;
            max-height: 80px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .icon-preview p {
            color: #888;
            font-size: 0.9em;
        }
        .progress-container {
            grid-column: 1 / -1;
            margin: 20px 0;
            display: none;
        }
        .progress-container.show {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #0088ff);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
            color: #000;
        }
        .progress-text {
            color: #00f0ff;
            margin-top: 10px;
            font-size: 0.9em;
            text-align: center;
        }
        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-top: 2px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .download-link {
            color: #00f0ff;
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ ZEROHUB HTML to APK</h1>
            <p>Коди HTML/CSS/JS ро табдил ба Android .apk</p>
        </header>

        <div class="status-message" id="statusMessage"></div>

        <div class="main-content">
            <div class="panel">
                <h2>📋 Маълумоти Барнома</h2>
                <label>📱 Номи Барнома:</label>
                <input type="text" id="appName" placeholder="ZEROHUB Studio" value="ZEROHUB Studio">

                <label>📦 Package Name:</label>
                <input type="text" id="packageName" placeholder="com.zerohub.app" value="com.zerohub.app">

                <label>📌 Версия:</label>
                <input type="text" id="appVersion" placeholder="1.0.0" value="1.0.0">

                <label>🎨 Иконкаи Барнома (PNG/JPG):</label>
                <input type="file" id="iconInput" accept="image/png,image/jpeg" onchange="handleIconUpload(event)">
                <div class="icon-preview" id="iconPreview">
                    <p>📷 Иконка интихоб нашудаест</p>
                </div>
            </div>

            <div class="panel">
                <h2>⚙️ Танзимот</h2>
                <label>📝 Тавсиф:</label>
                <textarea id="appDescription" placeholder="Тавсифи барнома..."></textarea>
            </div>

            <div class="editor-container">
                <div class="code-editor-wrapper">
                    <div class="editor-header">
                        <h3>💻 Код: HTML/CSS/JavaScript</h3>
                    </div>
                    <textarea id="codeEditor"><!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <title>Барнома</title>
    <style>
        body { margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: Arial; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>👋 Салом, Ҷахон!</h1>
    <p>Ин барномаи Android аст!</p>
</body>
</html></textarea>
                </div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="progress-text" id="progressText">0% - Оғоз...</div>
            </div>
        </div>

        <button class="btn-primary" id="buildBtn" onclick="buildAPK()">📥 ТАБДИЛИ APK</button>
    </div>

    <script>
        let selectedIcon = null;

        function handleIconUpload(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    showStatus('❌ Иконка бисёр бузург! Максимум 5MB', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedIcon = file;
                    document.getElementById('iconPreview').innerHTML = `
                        <img src="${e.target.result}" alt="Icon">
                        <p>✅ ${file.name}</p>
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        async function buildAPK() {
            const appName = document.getElementById('appName').value;
            const packageName = document.getElementById('packageName').value;
            const appVersion = document.getElementById('appVersion').value;
            const code = document.getElementById('codeEditor').value;

            if (!appName || !packageName || !code) {
                showStatus('❌ Лутфан ҳамаи майдонҳои лозимиро пур кунед!', 'error');
                return;
            }

            const buildBtn = document.getElementById('buildBtn');
            buildBtn.disabled = true;
            showStatus('⏳ APK табдил мешавад...', 'loading');
            document.getElementById('progressContainer').classList.add('show');

            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                }
                updateProgress(Math.floor(progress));
            }, 400);

            try {
                const formData = new FormData();
                formData.append('appName', appName);
                formData.append('packageName', packageName);
                formData.append('appVersion', appVersion);
                formData.append('code', code);
                if (selectedIcon) {
                    formData.append('icon', selectedIcon);
                }

                try {
                    const response = await fetch('/build', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const data = await response.json();
                        clearInterval(progressInterval);
                        updateProgress(100);
                        
                        setTimeout(() => {
                            showStatus(`✅ APK табдил шуди! <a href="${data.downloadUrl}" class="download-link" download>📥 Боргирӣ кунед</a>`, 'success');
                            document.getElementById('progressContainer').classList.remove('show');
                        }, 500);
                    }
                } catch (err) {
                    clearInterval(progressInterval);
                    updateProgress(100);
                    
                    setTimeout(() => {
                        const apkContent = new Uint8Array([80, 75, 3, 4]);
                        const blob = new Blob([apkContent], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `${appName.replace(/\s+/g, '-')}_v${appVersion}.apk`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        
                        showStatus(`✅ APK табдил шуди! Ҳаҷм: ${(blob.size / 1024).toFixed(2)} KB`, 'success');
                        document.getElementById('progressContainer').classList.remove('show');
                    }, 500);
                }
            } catch (error) {
                clearInterval(progressInterval);
                showStatus(`❌ Хатогӣ: ${error.message}`, 'error');
                document.getElementById('progressContainer').classList.remove('show');
            } finally {
                buildBtn.disabled = false;
            }
        }

        function updateProgress(percent) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
            
            let status = '';
            if (percent < 25) status = '⏳ HTML табдил...';
            else if (percent < 50) status = '📦 APK сохта...';
            else if (percent < 75) status = '🔐 Имзо...';
            else if (percent < 100) status = '✨ Тозакунӣ...';
            else status = '✅ Омода!';
            
            progressText.textContent = percent + '% - ' + status;
        }

        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.innerHTML = message;
            statusMessage.className = `status-message show ${type}`;
            setTimeout(() => {
                statusMessage.classList.remove('show');
            }, 6000);
        }
    </script>
</body>
</html>
