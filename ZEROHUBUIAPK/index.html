        body {

            background: #020205;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;

        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }

        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .panel {

            border-radius: 12px;
            padding: 30px;

        .panel h2 { color: #00f0ff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00f0ff; font-weight: 600; }
        input[type="text"], textarea {

            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            margin-bottom: 15px;
        }
        textarea { min-height: 300px; font-family: 'Courier New'; }
        .btn-primary {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .editor-container { grid-column: 1 / -1; }
